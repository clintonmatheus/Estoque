name: Publicar versão para computador (web)

on:
  workflow_dispatch:

# Publica na ramificação gh-pages. No GitHub: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - name: Endereço da página (/nome-do-repositório)
        run: |
          node -e "const f='app.json';const c=require('./'+f);c.expo.experiments={baseUrl:'/${{ github.event.repository.name }}'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npx expo export --platform web --output-dir dist
      - name: Ícone e instalação na tela inicial (PWA)
        run: node scripts/pwa.mjs dist "/${{ github.event.repository.name }}"
      - run: cp dist/index.html dist/404.html
      - name: Publicar na ramificação gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar versão web (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
